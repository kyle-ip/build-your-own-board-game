name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          force_orphan: true

      - name: Require GitHub Pages to be enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages not enabled::Open https://github.com/${GITHUB_REPOSITORY}/settings/pages — Source must be Deploy from a branch, branch gh-pages, folder / (root). Do NOT use GitHub Actions as the source."
            exit 1
          fi

          source_branch=$(jq -r '.source.branch // empty' /tmp/pages.json)
          if [ "$source_branch" != "gh-pages" ]; then
            echo "::error title=Wrong Pages source::Pages is set to branch '${source_branch}'. Change it to gh-pages at https://github.com/${GITHUB_REPOSITORY}/settings/pages"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          echo "Triggered Pages rebuild."
